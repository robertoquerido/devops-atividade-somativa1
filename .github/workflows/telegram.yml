name: Alerta Telegram

on:
  push:

permissions:
  contents: read

jobs:
  notificar:
    runs-on: ubuntu-latest

    steps:
      - name: Enviar alerta ao Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl --fail --silent --show-error \
            --output /dev/null \
            --request POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=Novo push no repositorio ${GITHUB_REPOSITORY}. Branch: ${GITHUB_REF_NAME}. Enviado por: ${GITHUB_ACTOR}. Commit: ${GITHUB_SHA}."